<script>

  var dayEl = document.getElementById('mast-day');
  var fullEl = document.getElementById('mast-full');
  var topbarDate = document.getElementById('topbar-date');

  if(fullEl) fullEl.textContent = days[d.getDay()] + ', ' + d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
